<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUMERA — Регистрация</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="auth-card">

            <a href="index.html" class="logo auth-logo">
                LUMERA
            </a>

            <span class="eyebrow">
                НОВЫЙ АККАУНТ
            </span>

            <h1>
                Создать аккаунт
            </h1>

            <p class="auth-description">
                Зарегистрируйтесь, чтобы сохранять товары
                и отслеживать заказы.
            </p>

            <form id="registerForm">

                <label>
                    Email

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="you@example.com"
                        required
                    >
                </label>

                <label>
                    Пароль

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Минимум 6 символов"
                        minlength="6"
                        required
                    >
                </label>

                <label>
                    Повторите пароль

                    <input
                        type="password"
                        id="registerPasswordConfirm"
                        placeholder="Повторите пароль"
                        required
                    >
                </label>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Создать аккаунт
                </button>

                <p
                    id="registerMessage"
                    class="auth-message"
                ></p>

            </form>

            <div class="auth-footer">
                Уже есть аккаунт?
                <a href="login.html">
                    Войти
                </a>
            </div>

            <a
                href="index.html"
                class="back-link"
            >
                ← Вернуться в магазин
            </a>

        </div>

    </main>

    <script src="auth.js"></script>

</body>
</html>
